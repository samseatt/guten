worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Refresh Docker DNS after an upstream container is replaced.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  client_max_body_size 5m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  server {
    listen 8080;
    set $crust_backend crust:8000;
    set $frontend_backend sites:3000;
    location /api/guten/published/ {
      limit_except GET { deny all; }
      proxy_pass http://$crust_backend;
    }
    location /api { return 404; }
    location / { proxy_pass http://$frontend_backend; }
  }
  server {
    listen 8081;
    set $crust_backend crust:8000;
    set $frontend_backend portal:3000;
    # LOCAL ONLY until authentication covers both Portal and these API routes.
    location /api/ { proxy_pass http://$crust_backend; }
    location / { proxy_pass http://$frontend_backend; }
  }
}
