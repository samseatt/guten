worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Do not log OAuth callback codes or other URL query credentials.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  map $http_origin $portal_origin_ok {
    default 0;
    "http://localhost:13001" 1;
    "http://127.0.0.1:13001" 1;
    "https://portal.guten.ink" 1;
  }
  map "$request_method:$portal_origin_ok" $portal_csrf_blocked {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~:1$ 0;
  }
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Refresh Docker DNS after an upstream container is replaced.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  client_max_body_size 5m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  server {
    listen 8080;
    set $crust_backend crust:8000;
    set $frontend_backend sites:3000;
    location /api/guten/published/ {
      limit_except GET { deny all; }
      proxy_pass http://$crust_backend;
    }
    location /api { return 404; }
    location / { proxy_pass http://$frontend_backend; }
  }
  server {
    listen 8081;
    set $auth_backend auth:4180;
    location / {
      # Caller-supplied identity headers cannot bypass authentication.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-User "";
      proxy_set_header X-Forwarded-Email "";
      proxy_set_header X-Forwarded-Access-Token "";
      proxy_set_header Authorization "";
      proxy_pass http://$auth_backend;
    }
  }
  # Internal upstream, never published on the host. All browser access uses OAuth above.
  server {
    listen 8082;
    set $crust_backend crust:8000;
    set $frontend_backend portal:3000;
    location /api/ {
      # Authenticated cookie requests also need a trusted Origin for mutations.
      if ($portal_csrf_blocked) { return 403; }
      proxy_pass http://$crust_backend;
    }
    location / { proxy_pass http://$frontend_backend; }
  }
}
