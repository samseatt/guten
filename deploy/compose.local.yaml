# Local rehearsal only: connect applications to the independently managed DB stack.
services:
  auth:
    environment:
      # HTTP is restricted to loopback for local development; base defaults require HTTPS.
      OAUTH2_PROXY_WHITELIST_DOMAINS: "localhost:13001"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:13001/oauth2/callback
  datalake:
    networks: [default, database]
  db-init:
    profiles: [tools]
    image: guten-datalake:${GUTEN_IMAGE_TAG:-local}
    command: [python, scripts/database/init_container_test.py]
    networks: [database]
    secrets: [database_url, postgres_password]
    restart: "no"
networks:
  database:
    external: true
    name: guten-local-database
secrets:
  postgres_password:
    file: ../.docker-local/postgres_password
